name = "floorplan-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret config (override in dashboard or with --var)
[vars]
EMAIL_FROM = "Floor Plan <onboarding@resend.dev>"
# Comma-separated list of allowed frontend origins, e.g.:
# ALLOWED_ORIGINS = "https://your-app.pages.dev,https://your-domain.com"
ALLOWED_ORIGINS = ""
EMAIL_RATE_LIMIT = "5"
EMAIL_RATE_WINDOW_MS = "900000"

# Secrets (do not put real values here):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put EMAIL_API_KEY
